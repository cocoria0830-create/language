<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="theme-color" content="#A855F7"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<link rel="manifest" href="manifest.json"/>
<title>✈️ 팝인 트래블</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{--pink:#FF6B9D;--mint:#00D4AA;--yellow:#FFD93D;--purple:#A855F7;--coral:#FF8C69;--sky:#38BDF8;--bg:#FFF5F9;--text:#2D1B4E;--muted:#9B8DB0;}
html,body{height:100%;overflow:hidden;}
body{background:var(--bg);font-family:'Nunito',sans-serif;color:var(--text);}
#app{display:flex;flex-direction:column;height:100vh;max-width:480px;margin:0 auto;}
.page{display:none;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:1rem;padding-bottom:80px;}
.page.active{display:block;}
#bottom-nav{display:flex;background:white;border-top:1.5px solid #EDE9FE;padding:6px 0 env(safe-area-inset-bottom);flex-shrink:0;z-index:100;}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 8px;cursor:pointer;border:none;background:none;font-family:'Nunito',sans-serif;flex:1;}
.nav-icon{font-size:20px;}.nav-label{font-size:9px;font-weight:800;color:var(--muted);}
.nav-item.active .nav-label{color:var(--purple);}.nav-item.active .nav-icon{transform:scale(1.15);}
.hidden{display:none!important;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
.card{background:white;border-radius:18px;padding:1rem;box-shadow:0 4px 14px rgba(168,85,247,.1);margin-bottom:.8rem;}
.pill-btn{display:block;width:100%;padding:13px;color:white;border:none;border-radius:50px;font-family:'Nunito',sans-serif;font-size:16px;font-weight:800;cursor:pointer;transition:all .2s cubic-bezier(.34,1.56,.64,1);margin-bottom:.6rem;}
.pill-btn:hover{transform:scale(1.03);}
.pill-btn:disabled{background:#D1C4E9!important;box-shadow:none!important;transform:none!important;cursor:not-allowed;}
.pill-pink{background:linear-gradient(135deg,var(--pink),var(--purple));box-shadow:0 6px 20px rgba(168,85,247,.35);}
.pill-mint{background:linear-gradient(135deg,var(--mint),#0EA5E9);box-shadow:0 4px 14px rgba(0,212,170,.3);}
.pill-coral{background:linear-gradient(135deg,var(--coral),var(--pink));box-shadow:0 5px 16px rgba(255,107,157,.35);}
.pill-sun{background:linear-gradient(135deg,var(--yellow),var(--coral));box-shadow:0 6px 20px rgba(255,140,105,.4);}
.section-title{font-family:'Fredoka One',cursive;font-size:15px;color:var(--text);margin-bottom:6px;}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:10px;font-weight:800;}
.chip{padding:4px 11px;background:white;border:2px solid #EDE9FE;border-radius:20px;font-size:11px;font-weight:800;cursor:pointer;transition:all .15s;color:var(--text);}
.chip:hover{border-color:var(--purple);}.chip.active{background:var(--purple);border-color:var(--purple);color:white;}
.loading-box{text-align:center;padding:1.2rem;background:white;border-radius:18px;box-shadow:0 4px 14px rgba(168,85,247,.1);margin-bottom:.8rem;}
.loading-dots{display:flex;justify-content:center;gap:6px;margin-bottom:6px;}
.ld{width:9px;height:9px;border-radius:50%;animation:bounce .8s infinite alternate;}
.ld:nth-child(1){background:var(--mint);}.ld:nth-child(2){background:var(--purple);animation-delay:.2s;}.ld:nth-child(3){background:var(--pink);animation-delay:.4s;}
@keyframes bounce{from{transform:translateY(0);}to{transform:translateY(-7px);}}
.loading-txt{font-size:12px;font-weight:800;color:var(--muted);}
.prog-bar{flex:1;height:7px;background:#F0E8FF;border-radius:20px;overflow:hidden;}
.prog-fill{height:100%;border-radius:20px;transition:width .4s ease;}
.prog-fill-purple{background:linear-gradient(90deg,var(--pink),var(--purple));}
.prog-fill-mint{background:linear-gradient(90deg,var(--mint),#0EA5E9);}
.back-btn{display:inline-flex;align-items:center;font-size:12px;color:var(--muted);cursor:pointer;background:none;border:none;font-family:'Nunito',sans-serif;font-weight:700;padding:0;margin-bottom:8px;}

/* ── 홈 (데일리 미션) ── */
.home-header{background:linear-gradient(135deg,#7C3AED,#A855F7,#EC4899);border-radius:20px;padding:1.1rem;margin-bottom:.8rem;color:white;position:relative;overflow:hidden;}
.home-header::before{content:'';position:absolute;width:100px;height:100px;border-radius:50%;background:rgba(255,255,255,.07);top:-20px;right:-20px;}
.home-header::after{content:'';position:absolute;width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.05);bottom:-10px;left:10px;}
.home-day{font-size:11px;font-weight:800;opacity:.85;margin-bottom:2px;}
.home-title{font-family:'Fredoka One',cursive;font-size:20px;margin-bottom:4px;}
.home-streak{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;opacity:.9;}
.home-progress{margin-top:10px;}
.home-prog-bar{width:100%;height:8px;background:rgba(255,255,255,.25);border-radius:20px;overflow:hidden;}
.home-prog-fill{height:100%;background:white;border-radius:20px;transition:width .5s ease;}
.home-prog-txt{font-size:10px;opacity:.8;margin-top:3px;font-weight:700;}
.mission-list{display:flex;flex-direction:column;gap:8px;margin-bottom:.8rem;}
.mission-item{background:white;border-radius:16px;padding:.8rem 1rem;display:flex;align-items:center;gap:10px;box-shadow:0 3px 10px rgba(168,85,247,.08);cursor:pointer;border:2px solid transparent;transition:all .2s ease;position:relative;}
.mission-item:hover{border-color:#EDE9FE;transform:translateY(-1px);}
.mission-item.done{background:#F0FDF4;border-color:#D1FAE5;}
.mission-item.locked{opacity:.5;cursor:not-allowed;}
.mission-item.active{border-color:var(--purple);background:#FAF5FF;}
.mission-icon{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.mission-info{flex:1;}
.mission-name{font-weight:800;font-size:13px;color:var(--text);margin-bottom:2px;}
.mission-desc{font-size:11px;color:var(--muted);font-weight:700;}
.mission-time{font-size:10px;font-weight:800;color:var(--muted);}
.mission-status{font-size:16px;flex-shrink:0;}
.mission-item.done .mission-status::after{content:'✅';}
.mission-item.locked .mission-status::after{content:'🔒';}
.mission-item:not(.done):not(.locked) .mission-status::after{content:'→';}
.today-done{background:linear-gradient(135deg,#D1FAE5,#A7F3D0);border-radius:18px;padding:1.2rem;text-align:center;margin-bottom:.8rem;border:2px solid #10B981;}
.streak-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:.8rem;}
.streak-card{background:white;border-radius:13px;padding:8px;text-align:center;box-shadow:0 2px 8px rgba(168,85,247,.08);}
.streak-num{font-family:'Fredoka One',cursive;font-size:22px;color:var(--purple);}
.streak-lbl{font-size:10px;font-weight:800;color:var(--muted);}

/* ── 언어 선택 ── */
.lang-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 auto .8rem;}
.lang-card{background:white;border-radius:18px;padding:14px 6px;text-align:center;cursor:pointer;border:2.5px solid transparent;transition:all .2s cubic-bezier(.34,1.56,.64,1);position:relative;box-shadow:0 4px 12px rgba(168,85,247,.08);z-index:1;}
.lang-card:hover{transform:translateY(-2px) scale(1.02);box-shadow:0 8px 20px rgba(168,85,247,.18);z-index:10;}
.lang-card.selected{border-color:var(--purple);background:#FAF5FF;transform:translateY(-2px) scale(1.02);z-index:10;}
.lang-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;border-radius:18px 18px 0 0;pointer-events:none;}
.lang-card.eng::before{background:linear-gradient(90deg,#4267B2,#60A5FA);}
.lang-card.jpn::before{background:linear-gradient(90deg,#EF4444,#FF8C69);}
.lang-card.chn::before{background:linear-gradient(90deg,#EF4444,#FFD93D);}
.lang-card.spa::before{background:linear-gradient(90deg,#EF4444,#FFD93D);}
.lang-card.tha::before{background:linear-gradient(90deg,#4267B2,#EF4444);}
.lang-card.ita::before{background:linear-gradient(90deg,#16A34A,#fff,#EF4444);}
.lang-card.selected::after{content:'✓';position:absolute;top:6px;right:8px;font-size:12px;color:var(--purple);font-weight:800;pointer-events:none;}
.flag{font-size:28px;display:block;margin-bottom:5px;}
.lang-name{font-size:12px;font-weight:800;color:var(--text);}
.lang-eng{font-size:10px;color:var(--muted);font-weight:600;}

/* ── 미션 공통 화면 ── */
.mission-header{display:flex;align-items:center;gap:10px;margin-bottom:.8rem;}
.mission-header-icon{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;}
.mission-header-title{font-family:'Fredoka One',cursive;font-size:18px;color:var(--text);}
.mission-header-sub{font-size:11px;color:var(--muted);font-weight:700;}
.complete-btn-wrap{position:sticky;bottom:0;padding:.7rem 0 0;background:linear-gradient(transparent,var(--bg) 40%);}

/* ── 어순 트레이닝 ── */
.word-order-wrap{margin-bottom:.8rem;}
.sentence-compare{background:white;border-radius:16px;padding:.9rem;margin-bottom:.7rem;box-shadow:0 4px 12px rgba(168,85,247,.09);}
.lang-label{font-size:10px;font-weight:800;color:var(--muted);margin-bottom:4px;}
.sentence-blocks{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:4px;}
.sblock{padding:4px 10px;border-radius:8px;font-size:13px;font-weight:800;}
.sblock-kr{background:#FAF5FF;color:var(--purple);}
.sblock-tgt{color:white;font-size:12px;}
.sblock-0{background:#FF6B9D;}.sblock-1{background:#A855F7;}.sblock-2{background:#00D4AA;}.sblock-3{background:#FF8C69;}.sblock-4{background:#38BDF8;}.sblock-5{background:#FFD93D;color:#2D1B4E;}
.arrow-row{text-align:center;font-size:18px;margin:4px 0;color:var(--muted);}
.order-quiz{background:white;border-radius:16px;padding:.9rem;box-shadow:0 4px 12px rgba(168,85,247,.09);margin-bottom:.7rem;}
.quiz-question{font-size:13px;font-weight:800;color:var(--text);margin-bottom:.5rem;line-height:1.5;}
.quiz-kr{background:#FAF5FF;border-radius:10px;padding:7px 10px;font-size:13px;font-weight:800;color:var(--purple);margin-bottom:.6rem;}
.answer-slots{display:flex;flex-wrap:wrap;gap:5px;min-height:38px;background:#F9F5FF;border-radius:10px;padding:6px;margin-bottom:.6rem;border:2px dashed #EDE9FE;}
.answer-slot{padding:5px 10px;border-radius:8px;font-size:13px;font-weight:800;color:white;cursor:pointer;animation:fadeIn .2s ease;}
.word-choices{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:.7rem;}
.word-choice{padding:6px 12px;background:white;border:2.5px solid #EDE9FE;border-radius:10px;font-size:13px;font-weight:800;cursor:pointer;color:var(--text);transition:all .15s;}
.word-choice:hover{border-color:var(--purple);background:#FAF5FF;}
.word-choice.used{opacity:.3;cursor:not-allowed;}
.quiz-feedback{border-radius:12px;padding:9px 12px;margin-bottom:.6rem;font-size:12px;font-weight:700;line-height:1.6;animation:fadeIn .3s ease;}
.quiz-feedback.correct{background:#D1FAE5;color:#065F46;border-left:3px solid #10B981;}
.quiz-feedback.wrong{background:#FEE2E2;color:#991B1B;border-left:3px solid #EF4444;}
.order-explain{background:#FAF5FF;border-radius:12px;padding:9px 12px;font-size:12px;font-weight:700;color:var(--text);line-height:1.6;margin-bottom:.6rem;border-left:3px solid var(--purple);}

/* ── 단어 카드 ── */
.card-scene{perspective:1000px;width:100%;max-width:340px;margin:0 auto .7rem;height:180px;}
.card-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .5s;cursor:pointer;}
.card-inner.flipped{transform:rotateY(180deg);}
.card-face{position:absolute;inset:0;border-radius:20px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1rem;}
.card-front{background:linear-gradient(145deg,#7C3AED,#A855F7,#EC4899);color:white;box-shadow:0 8px 24px rgba(168,85,247,.35);}
.card-back{background:white;border:2.5px solid #EDE9FE;transform:rotateY(180deg);box-shadow:0 8px 24px rgba(168,85,247,.12);}
.card-word{font-size:36px;font-weight:800;text-shadow:0 2px 8px rgba(0,0,0,.2);text-align:center;}
.card-phonetic{font-size:12px;opacity:.8;margin-top:2px;font-weight:700;}
.judge-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:.6rem;}
.judge-btn{padding:8px 4px;border:2.5px solid transparent;border-radius:13px;font-family:'Nunito',sans-serif;font-size:11px;font-weight:800;cursor:pointer;transition:all .18s;display:flex;flex-direction:column;align-items:center;gap:2px;}
.judge-btn span{font-size:15px;}
.btn-know{background:#D1FAE5;border-color:#10B981;color:#065F46;}
.btn-vague{background:#FEF3C7;border-color:#F59E0B;color:#92400E;}
.btn-new2{background:#FEE2E2;border-color:#EF4444;color:#991B1B;}
.judge-btn:disabled{opacity:.35;cursor:not-allowed;}

/* ── 리스닝 ── */
.player-card{background:white;border-radius:18px;padding:1rem;box-shadow:0 4px 14px rgba(0,212,170,.12);margin-bottom:.7rem;border:2px solid #E0FDF4;}
.waveform{display:flex;align-items:center;justify-content:center;gap:3px;height:32px;margin-bottom:.6rem;}
.wv-bar{width:4px;background:var(--mint);border-radius:3px;opacity:.25;}
.wv-bar.active{opacity:1;animation:wvbar .4s infinite alternate;}
@keyframes wvbar{from{height:5px;}to{height:24px;}}
.play-btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;}
.play-btn{padding:8px 5px;border:2px solid #EDE9FE;border-radius:12px;font-family:'Nunito',sans-serif;font-size:11px;font-weight:800;cursor:pointer;transition:all .15s;text-align:center;background:white;color:var(--text);}
.play-btn.playing{background:linear-gradient(135deg,var(--mint),#0EA5E9);border-color:transparent;color:white;}
.play-btn span{font-size:15px;display:block;margin-bottom:1px;}
.blur-box{font-size:14px;font-weight:800;background:#F0FDF4;border-radius:10px;padding:8px 11px;filter:blur(5px);transition:filter .3s;cursor:pointer;margin-top:.5rem;}
.blur-box.revealed{filter:none;}
.ans-textarea{width:100%;padding:9px 11px;border:2px solid #EDE9FE;border-radius:12px;font-family:'Nunito',sans-serif;font-size:13px;font-weight:700;color:var(--text);resize:none;outline:none;min-height:60px;}
.ans-textarea:focus{border-color:var(--purple);}
.score-ring{width:65px;height:65px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Fredoka One',cursive;font-size:20px;color:white;margin:0 auto .5rem;flex-direction:column;}
.score-hi{background:linear-gradient(135deg,#10B981,#059669);}
.score-md{background:linear-gradient(135deg,var(--mint),#0EA5E9);}
.score-lo{background:linear-gradient(135deg,var(--yellow),var(--coral));}

/* ── 작문 코치 ── */
.mode-tabs{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:.7rem;}
.mode-tab{padding:10px 8px;background:white;border:2.5px solid #EDE9FE;border-radius:14px;font-family:'Nunito',sans-serif;font-size:12px;font-weight:800;color:var(--muted);cursor:pointer;transition:all .2s;text-align:center;}
.mode-tab.active{background:linear-gradient(135deg,var(--pink),var(--purple));border-color:transparent;color:white;}
.mode-tab .tab-icon{font-size:18px;display:block;margin-bottom:2px;}
.coach-textarea{width:100%;padding:10px 12px;border:2px solid #EDE9FE;border-radius:12px;font-family:'Nunito',sans-serif;font-size:13px;font-weight:700;color:var(--text);resize:none;outline:none;min-height:75px;line-height:1.6;}
.coach-textarea:focus{border-color:var(--purple);}
.ex-chip{padding:3px 9px;background:#FAF5FF;border:1.5px solid #EDE9FE;border-radius:20px;font-size:10px;font-weight:700;color:var(--purple);cursor:pointer;display:inline-block;margin:2px;}
.result-card{background:white;border-radius:18px;padding:1rem;box-shadow:0 4px 14px rgba(168,85,247,.1);margin-bottom:.8rem;animation:fadeIn .4s ease;}
.rs-title{font-size:11px;font-weight:800;color:var(--muted);margin-bottom:5px;}
.sentence-box{background:#FAF5FF;border-radius:12px;padding:9px 12px;border-left:3px solid var(--purple);}
.sentence-main{font-size:15px;font-weight:800;color:var(--text);line-height:1.5;}
.bk-row{display:flex;align-items:flex-start;gap:8px;padding:5px 9px;background:#F9F5FF;border-radius:9px;margin-bottom:4px;}
.bk-word{font-size:12px;font-weight:800;color:var(--purple);min-width:65px;flex-shrink:0;}
.tip-box{background:#FFFBEB;border-radius:12px;padding:9px 12px;border-left:3px solid #F59E0B;font-size:12px;font-weight:700;color:var(--text);line-height:1.6;}
.correction-box{background:#FFF5F5;border-radius:12px;padding:9px 12px;border-left:3px solid #EF4444;margin-bottom:7px;}
.corr-original{font-size:12px;font-weight:700;color:#991B1B;text-decoration:line-through;}
.corr-fixed{font-size:13px;font-weight:800;color:#065F46;}
.corr-reason{font-size:11px;font-weight:700;color:var(--text);line-height:1.5;background:#FEF3C7;border-radius:8px;padding:5px 9px;margin-top:3px;}

/* ── 대화 시뮬레이션 ── */
.sit-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:.8rem;}
.sit-card{background:white;border-radius:16px;padding:11px 8px;text-align:center;cursor:pointer;border:2.5px solid #EDE9FE;transition:all .2s cubic-bezier(.34,1.56,.64,1);}
.sit-card:hover{transform:translateY(-2px);border-color:var(--purple);}
.sit-card.selected{border-color:var(--purple);background:#FAF5FF;}
.sit-emoji{font-size:26px;display:block;margin-bottom:3px;}
.sit-name{font-size:12px;font-weight:800;color:var(--text);}
.sit-desc{font-size:9px;color:var(--muted);font-weight:600;}
.chat-area{background:white;border-radius:14px;padding:.7rem;min-height:200px;max-height:280px;overflow-y:auto;box-shadow:0 3px 10px rgba(168,85,247,.08);margin-bottom:.6rem;}
.bubble-wrap{margin-bottom:.5rem;display:flex;flex-direction:column;}
.bubble-wrap.npc{align-items:flex-start;}.bubble-wrap.user{align-items:flex-end;}
.bubble{max-width:82%;padding:7px 11px;border-radius:15px;font-size:12px;font-weight:700;line-height:1.5;}
.bubble.npc{background:#F0E8FF;color:var(--text);border-bottom-left-radius:4px;}
.bubble.user{background:linear-gradient(135deg,var(--pink),var(--purple));color:white;border-bottom-right-radius:4px;}
.bubble-name{font-size:9px;font-weight:800;color:var(--muted);margin-bottom:1px;}
.bubble-kr{font-size:10px;color:var(--muted);font-weight:600;margin-top:2px;}
.typing-ind{display:none;align-items:center;gap:3px;padding:7px 11px;background:#F0E8FF;border-radius:15px;width:fit-content;margin-bottom:.5rem;}
.typing-ind.show{display:flex;}
.td{width:6px;height:6px;border-radius:50%;background:var(--purple);animation:tdot .8s infinite alternate;}
.td:nth-child(2){animation-delay:.2s;}.td:nth-child(3){animation-delay:.4s;}
@keyframes tdot{from{transform:scale(.6);opacity:.4;}to{transform:scale(1);opacity:1;}}
.input-area{background:white;border-radius:14px;padding:.7rem;box-shadow:0 3px 10px rgba(168,85,247,.08);margin-bottom:.6rem;}
.chat-input{width:100%;padding:8px 11px;border:2px solid #EDE9FE;border-radius:11px;font-family:'Nunito',sans-serif;font-size:12px;font-weight:700;outline:none;resize:none;}
.chat-input:focus{border-color:var(--purple);}
.send-btn{padding:8px 14px;background:linear-gradient(135deg,var(--pink),var(--purple));color:white;border:none;border-radius:11px;font-family:'Nunito',sans-serif;font-size:13px;font-weight:800;cursor:pointer;}
.send-btn:disabled{background:#D1C4E9;cursor:not-allowed;}
.hint-box{background:#FEF3C7;border-radius:9px;padding:5px 9px;margin-bottom:.4rem;font-size:10px;font-weight:700;color:#92400E;display:none;}
.hint-box.show{display:block;}
.qr-row{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:.5rem;}
.qr-btn{padding:4px 10px;background:white;border:2px solid #EDE9FE;border-radius:20px;font-size:10px;font-weight:800;cursor:pointer;color:var(--text);}
</style>
</head>
<body>
<div id="app">
<nav id="bottom-nav">

<div class="page active" id="p-home"></div>

<!-- ② 단어 카드 -->
<div class="page" id="p-words"></div>

<!-- ③ 어순 트레이닝 -->
<div class="page" id="p-order"></div>

<!-- ④ 작문 코치 -->
<div class="page" id="p-coach"></div>

<!-- ④ 문자 학습 -->

<!-- ⑤ 대화 시뮬 -->
<div class="page" id="p-sim"></div>

<script>
// ════════════════════════════════════════════
//  전역 상태
// ════════════════════════════════════════════
const SAVE_KEY = 'popin_v2';
let appState = {
  lang: null,
  langCfg: null,
  cardLevel: 1,
  streak: 0,
  lastDate: null,
  todayDone: {},      // {step1:true, step2:false, ...}
  wordCollection: {}, // {word: {mean, type}}
  wordIdx: 0,
};

function saveState(){
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(appState)); }catch(e){}
}
function loadState(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(raw) Object.assign(appState, JSON.parse(raw));
  }catch(e){}
}

// ════════════════════════════════════════════
//  네비게이션
// ════════════════════════════════════════════
function goPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  const pages = ['p-home','p-script','p-words','p-order','p-coach'];
  document.querySelectorAll('.nav-item').forEach((b,i)=>b.classList.toggle('active', pages[i]===id));
  if(id==='p-home') renderHome();
  if(id==='p-script') renderScript();
  if(id==='p-words') renderWords();
  if(id==='p-order') renderOrder();
  if(id==='p-coach') renderCoach();
  if(id==='p-sim') renderSim();
}

// ════════════════════════════════════════════
//  언어 설정
// ════════════════════════════════════════════
const LANG_CFG = {
  eng:{name:'영어',flag:'🇺🇸',bcp:'en-US'},
  jpn:{name:'일본어',flag:'🇯🇵',bcp:'ja-JP'},
  chn:{name:'중국어',flag:'🇨🇳',bcp:'zh-CN'},
  spa:{name:'스페인어',flag:'🇪🇸',bcp:'es-ES'},
  tha:{name:'태국어',flag:'🇹🇭',bcp:'th-TH'},
  ita:{name:'이탈리아어',flag:'🇮🇹',bcp:'it-IT'},
};

// ════════════════════════════════════════════
//  홈 렌더링
// ════════════════════════════════════════════
const MISSIONS = [
  {id:'script', icon:'📝', color:'#7C3AED', bg:'#F5F3FF', name:'문자 & 발음',   desc:'문자 읽기 & 발음 연습',  time:'5분',  page:'p-script'},
  {id:'words',  icon:'📖', color:'#A855F7', bg:'#FAF5FF', name:'단어 카드',     desc:'오늘의 단어 10장 학습',  time:'5분',  page:'p-words'},
  {id:'order',  icon:'🔀', color:'#FF6B9D', bg:'#FFF5F9', name:'어순 트레이닝', desc:'한→타겟 언어 어순 연습', time:'7분',  page:'p-order'},
  {id:'listen', icon:'👂', color:'#00D4AA', bg:'#F0FDF4', name:'리스닝',        desc:'원어민 음성 듣고 해석',  time:'5분',  page:'p-coach'},
  {id:'coach',  icon:'✍️', color:'#FF8C69', bg:'#FFF5F0', name:'작문 코치',     desc:'내 문장 → 원어민 표현',  time:'5분',  page:'p-coach'},
  {id:'sim',    icon:'🎭', color:'#38BDF8', bg:'#F0F9FF', name:'대화 시뮬',     desc:'실제 상황 롤플레이',     time:'10분', page:'p-sim'},
];

function renderHome(){
  const wrap = document.getElementById('p-home');
  wrap.innerHTML = '';

  // 언어 미선택 시 선택 화면
  if(!appState.lang){
    wrap.innerHTML = `
      <div style="text-align:center;padding:.5rem 0 .8rem;">
        <div style="font-family:'Fredoka One',cursive;font-size:24px;background:linear-gradient(135deg,var(--pink),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">✈️ Pop-in Travel</div>
        <div style="font-size:12px;color:var(--muted);font-weight:700;margin-top:2px;">100일 다국어 기적 ✨</div>
      </div>
      <div class="card" style="text-align:center;margin-bottom:.8rem;">
        <div style="font-size:20px;margin-bottom:5px;">🌍</div>
        <div style="font-family:'Fredoka One',cursive;font-size:15px;color:var(--text);margin-bottom:3px;">배울 언어를 선택하세요!</div>
        <div style="font-size:11px;color:var(--muted);font-weight:700;">언제든지 바꿀 수 있어요</div>
      </div>
      <div class="lang-grid" id="lang-grid-home"></div>
      <button class="pill-btn pill-pink" id="lang-confirm-btn" disabled onclick="confirmLang()">시작하기 →</button>
    `;
    let selKey = null;
    const grid = document.getElementById('lang-grid-home');
    Object.entries(LANG_CFG).forEach(([key,cfg])=>{
      const card = document.createElement('div');
      card.className = 'lang-card '+key;
      card.dataset.lang = key;
      card.innerHTML = `<span class="flag">${cfg.flag}</span><div class="lang-name">${cfg.name}</div><div class="lang-eng">${key}</div>`;
      card.addEventListener('click',()=>{
        document.querySelectorAll('#lang-grid-home .lang-card').forEach(c=>c.classList.remove('selected'));
        card.classList.add('selected');
        selKey = key;
        document.getElementById('lang-confirm-btn').disabled = false;
      });
      grid.appendChild(card);
    });
    window._selLangKey = ()=>selKey;
    return;
  }

  // 오늘 날짜 체크 & 연속일 계산
  const today = new Date().toDateString();
  if(appState.lastDate !== today){
    const yesterday = new Date(Date.now()-86400000).toDateString();
    if(appState.lastDate === yesterday) appState.streak = (appState.streak||0)+1;
    else if(appState.lastDate !== today) appState.streak = 1;
    appState.lastDate = today;
    appState.todayDone = {};
    saveState();
  }

  const cfg = LANG_CFG[appState.lang];
  const doneCnt = Object.values(appState.todayDone).filter(Boolean).length;
  const totalMissions = MISSIONS.length;
  const allDone = doneCnt >= totalMissions;

  // 헤더
  const dayNum = appState.streak || 1;
  const header = document.createElement('div');
  header.className = 'home-header';
  header.innerHTML = `
    <div class="home-day">Day ${dayNum} · ${cfg.flag} ${cfg.name}</div>
    <div class="home-title">오늘의 미션 🎯</div>
    <div class="home-streak">🔥 ${appState.streak || 1}일 연속 학습 중!</div>
    <div class="home-progress">
      <div class="home-prog-bar"><div class="home-prog-fill" style="width:${Math.round(doneCnt/totalMissions*100)}%"></div></div>
      <div class="home-prog-txt">${doneCnt}/${totalMissions} 완료 · 오늘 예상 시간: 32분</div>
    </div>
  `;
  wrap.appendChild(header);

  // 전체 완료 배너
  if(allDone){
    const doneBanner = document.createElement('div');
    doneBanner.className = 'today-done';
    doneBanner.innerHTML = `<div style="font-size:36px;">🏆</div><div style="font-family:'Fredoka One',cursive;font-size:18px;color:#065F46;margin:4px 0;">오늘 미션 완료!</div><div style="font-size:12px;font-weight:700;color:#047857;">정말 대단해요! 내일도 함께해요 🌟</div>`;
    wrap.appendChild(doneBanner);
  }

  // 미션 리스트
  const missionList = document.createElement('div');
  missionList.className = 'mission-list';
  MISSIONS.forEach((m,i)=>{
    const isDone = !!appState.todayDone[m.id];
    const isLocked = !isDone && i > 0 && !appState.todayDone[MISSIONS[i-1].id];
    const isActive = !isDone && !isLocked;

    const item = document.createElement('div');
    item.className = 'mission-item' + (isDone?' done':isLocked?' locked':isActive?' active':'');
    item.innerHTML = `
      <div class="mission-icon" style="background:${m.bg};">${m.icon}</div>
      <div class="mission-info">
        <div class="mission-name">${m.name}</div>
        <div class="mission-desc">${m.desc}</div>
        <div class="mission-time">⏱ ${m.time}</div>
      </div>
      <div class="mission-status"></div>
    `;
    if(isDone){
      item.querySelector('.mission-status').innerText = '✅';
    } else if(isLocked){
      item.querySelector('.mission-status').innerText = '🔒';
    } else {
      item.querySelector('.mission-status').innerText = '▶';
      item.addEventListener('click',()=>{
        if(m.id==='listen'||m.id==='coach') goPage('p-coach');
        else goPage(m.page);
      });
    }
    missionList.appendChild(item);
  });
  wrap.appendChild(missionList);

  // 통계 카드
  const stats = document.createElement('div');
  stats.className = 'streak-cards';
  stats.innerHTML = `
    <div class="streak-card"><div class="streak-num">${appState.streak||1}</div><div class="streak-lbl">🔥 연속일</div></div>
    <div class="streak-card"><div class="streak-num">${Object.keys(appState.wordCollection||{}).length}</div><div class="streak-lbl">📦 수집 단어</div></div>
    <div class="streak-card"><div class="streak-num">${doneCnt}</div><div class="streak-lbl">✅ 오늘 완료</div></div>
  `;
  wrap.appendChild(stats);

  // 언어 변경 버튼
  const changeLangBtn = document.createElement('button');
  changeLangBtn.className = 'pill-btn';
  changeLangBtn.style.cssText = 'background:white;color:var(--purple);border:2px solid #EDE9FE;box-shadow:none;font-size:13px;';
  changeLangBtn.innerText = '🌍 언어 변경';
  changeLangBtn.onclick = ()=>{ appState.lang=null; saveState(); renderHome(); };
  wrap.appendChild(changeLangBtn);
}

// 레벨 테스트 실행
function startLevelTest(lang){
  const wrap = document.getElementById('p-home');
  wrap.innerHTML = '';
  const stages = LEVEL_TEST_DATA[lang] || LEVEL_TEST_DATA.eng;
  let stageIdx = 0;   // 현재 단계 (0=lv1문제, 1=lv2문제 ...)
  let qIdx = 0;       // 현재 단계 내 문제 번호
  let stageCorrect = 0;
  let finalLevel = 0; // 통과한 최고 레벨
  let answered = false;

  function getTotalProgress(){
    return stageIdx * stages[0].length + qIdx;
  }
  function getTotalQuestions(){
    return stages.length * stages[0].length;
  }

  // 헤더
  const hdr = document.createElement('div');
  hdr.className = 'home-header';
  hdr.innerHTML = '<div class="home-day">레벨 테스트</div><div class="home-title">내 실력을 확인해봐요! 🎯</div><div class="home-streak">'+LANG_CFG[lang].flag+' '+LANG_CFG[lang].name+'</div>';
  wrap.appendChild(hdr);

  // 단계 사다리
  const ladderDiv = document.createElement('div');
  ladderDiv.id = 'lt-ladder';
  ladderDiv.style.cssText = 'display:flex;align-items:center;justify-content:center;gap:4px;margin-bottom:.7rem;';
  wrap.appendChild(ladderDiv);

  // 진행바
  const progRow = document.createElement('div');
  progRow.style.cssText = 'display:flex;align-items:center;gap:8px;margin-bottom:.7rem;';
  const pb=document.createElement('div'); pb.className='prog-bar';
  const pf=document.createElement('div'); pf.className='prog-fill prog-fill-purple'; pf.id='lt-prog-fill';
  pb.appendChild(pf);
  const pt=document.createElement('div'); pt.id='lt-prog-txt'; pt.style.cssText='font-size:11px;font-weight:800;color:var(--muted);white-space:nowrap;';
  progRow.appendChild(pb); progRow.appendChild(pt);
  wrap.appendChild(progRow);

  const qCard = document.createElement('div'); qCard.id='lt-q-card';
  wrap.appendChild(qCard);

  function renderLadder(){
    ladderDiv.innerHTML = '';
    const stageNames = ['🌱','🌿','🌸','🌺','🔥'];
    stageNames.forEach((emoji,i)=>{
      if(i>0){
        const line=document.createElement('div');
        line.style.cssText='width:24px;height:3px;border-radius:3px;background:'+(i<=stageIdx?'var(--mint)':'#EDE9FE')+';margin-bottom:14px;';
        ladderDiv.appendChild(line);
      }
      const dot=document.createElement('div');
      dot.style.cssText='display:flex;flex-direction:column;align-items:center;gap:2px;';
      const circle=document.createElement('div');
      const isDone=i<stageIdx;
      const isCurrent=i===stageIdx;
      circle.style.cssText='width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;transition:all .3s;'+(isDone?'background:var(--mint);color:white;':isCurrent?'background:linear-gradient(135deg,var(--pink),var(--purple));color:white;box-shadow:0 0 0 3px rgba(168,85,247,.2);transform:scale(1.1);':'background:white;border:2.5px solid #EDE9FE;');
      circle.innerText=isDone?'✓':emoji;
      const lbl=document.createElement('div');
      lbl.style.cssText='font-size:9px;font-weight:800;color:'+(isCurrent?'var(--purple)':'var(--muted)')+';';
      lbl.innerText='레벨'+(i+1);
      dot.appendChild(circle); dot.appendChild(lbl);
      ladderDiv.appendChild(dot);
    });
  }

  function renderQ(){
    const q = stages[stageIdx][qIdx];
    answered = false;
    const total=getTotalProgress();
    const totalQ=getTotalQuestions();
    pf.style.width=((total+1)/totalQ*100)+'%';
    pt.innerText='단계'+(stageIdx+1)+' · '+(qIdx+1)+'/'+stages[stageIdx].length;
    renderLadder();

    qCard.innerHTML='<div class="card" style="margin-bottom:.7rem;">'
      +'<div style="font-size:10px;font-weight:800;color:var(--purple);background:#FAF5FF;display:inline-block;padding:3px 9px;border-radius:20px;margin-bottom:.5rem;">레벨'+(stageIdx+1)+' 문제</div>'
      +'<div style="font-size:14px;font-weight:800;color:var(--text);line-height:1.5;margin-bottom:.7rem;">'+q.q+'</div>'
      +'<div id="lt-opts" style="display:flex;flex-direction:column;gap:7px;"></div>'
      +'<div id="lt-feedback" style="display:none;border-radius:10px;padding:8px 11px;margin-top:.6rem;font-size:12px;font-weight:700;line-height:1.5;"></div>'
      +'</div>'
      +'<button class="pill-btn pill-mint" id="lt-next-btn" disabled onclick="ltNext()" style="font-size:15px;padding:11px;">다음 →</button>';

    const optsDiv=document.getElementById('lt-opts');
    q.opts.forEach((opt,i)=>{
      const btn=document.createElement('button');
      btn.style.cssText='padding:10px 12px;background:white;border:2.5px solid #EDE9FE;border-radius:12px;font-family:Nunito,sans-serif;font-size:13px;font-weight:700;color:var(--text);cursor:pointer;text-align:left;transition:all .15s;';
      btn.innerText=opt;
      btn.onclick=()=>checkLT(i,q,btn);
      optsDiv.appendChild(btn);
    });
  }

  window.checkLT=function(chosen,q,btn){
    if(answered) return;
    answered=true;
    const opts=document.getElementById('lt-opts').querySelectorAll('button');
    opts.forEach((b,i)=>{
      b.disabled=true;
      if(i===q.ans) b.style.background='#D1FAE5', b.style.borderColor='#10B981', b.style.color='#065F46';
      if(i===chosen&&chosen!==q.ans) b.style.background='#FEE2E2', b.style.borderColor='#EF4444', b.style.color='#991B1B';
    });
    const ok=chosen===q.ans;
    if(ok) stageCorrect++;
    const fb=document.getElementById('lt-feedback');
    fb.style.display='block';
    fb.style.cssText='display:block;border-radius:10px;padding:8px 11px;margin-top:.6rem;font-size:12px;font-weight:700;line-height:1.5;background:'+(ok?'#D1FAE5':'#FEE2E2')+';color:'+(ok?'#065F46':'#991B1B')+';';
    fb.innerHTML=(ok?'🎉 정답이에요! ':'💜 아쉽지만 괜찮아요! ')+q.ex;
    const nextBtn=document.getElementById('lt-next-btn');
    if(nextBtn) nextBtn.disabled=false;
    if(qIdx===stages[stageIdx].length-1 && nextBtn){
      nextBtn.innerText='단계 결과 확인 →';
    }
  };

  window.ltNext=function(){
    qIdx++;
    if(qIdx>=stages[stageIdx].length){
      // 단계 완료! 80% 이상이면 통과
      const passRate = stageCorrect / stages[stageIdx].length;
      const passed = passRate >= 0.8;
      if(passed){
        finalLevel = stageIdx+1;
        stageIdx++;
        qIdx=0; stageCorrect=0;
        if(stageIdx >= stages.length){
          showLTResult(true);
        } else {
          // 통과 배너 보여주고 다음 단계로
          showStageBanner(true);
        }
      } else {
        showLTResult(false);
      }
    } else {
      renderQ();
    }
  };

  function showStageBanner(passed){
    qCard.innerHTML='<div style="background:linear-gradient(135deg,#D1FAE5,#A7F3D0);border-radius:16px;padding:1.1rem;text-align:center;border:2px solid #10B981;animation:fadeIn .3s ease;">'
      +'<div style="font-size:36px;margin-bottom:4px;">🎉</div>'
      +'<div style="font-family:Fredoka One,cursive;font-size:18px;color:#065F46;margin-bottom:2px;">레벨'+(stageIdx)+' 통과!</div>'
      +'<div style="font-size:12px;font-weight:700;color:#047857;">다음 단계로 올라갈게요 💪</div>'
      +'</div>';
    setTimeout(()=>renderQ(), 1500);
  }

  function showLTResult(){
    const displayLevel = finalLevel + 1; // 통과한 마지막 + 1 = 내 레벨 (시작 레벨)
    const safeLv = Math.min(Math.max(displayLevel, 1), 6);
    appState.cardLevel = safeLv;
    appState.lang = lang;
    saveState();

    wrap.innerHTML='';
    const resultDiv=document.createElement('div');
    resultDiv.style.cssText='text-align:center;padding:.5rem 0;animation:fadeIn .4s ease;';
    resultDiv.innerHTML='<div style="font-size:52px;margin-bottom:6px;">'+LEVEL_NAMES[safeLv].split(' ')[0]+'</div>'

      +'<div style="background:linear-gradient(135deg,var(--pink),var(--purple));color:white;font-family:Fredoka One,cursive;font-size:13px;padding:5px 18px;border-radius:30px;display:inline-block;margin:5px 0 4px;">'+LANG_CFG[lang].flag+' '+LANG_CFG[lang].name+' · 레벨 '+safeLv+'</div>'
      +'<div style="font-size:12px;font-weight:700;color:var(--muted);margin:.4rem 0 .8rem;">'+LEVEL_DESC[safeLv]+'</div>'
      +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:.8rem;">'
      +'<div style="background:white;border-radius:13px;padding:8px;border:2px solid #EDE9FE;text-align:center;"><div style="font-family:Fredoka One,cursive;font-size:20px;color:var(--purple);">'+finalLevel+'</div><div style="font-size:10px;font-weight:800;color:var(--muted);">통과 단계</div></div>'
      +'<div style="background:white;border-radius:13px;padding:8px;border:2px solid #EDE9FE;text-align:center;"><div style="font-family:Fredoka One,cursive;font-size:20px;color:var(--purple);">'+stages.length+'</div><div style="font-size:10px;font-weight:800;color:var(--muted);">총 단계</div></div>'
      +'</div>';
    const startBtn=document.createElement('button');
    startBtn.className='pill-btn pill-sun';
    startBtn.innerText='레벨 '+safeLv+' 카드로 학습 시작! 🚀';
    startBtn.onclick=()=>{ renderHome(); };
    resultDiv.appendChild(startBtn);

    // 레벨 0 선택지 (문자 학습부터)
    const altDiv=document.createElement('div');
    altDiv.style.cssText='margin-top:.7rem;';
    altDiv.innerHTML='<div style="font-size:11px;font-weight:800;color:var(--muted);margin-bottom:6px;text-align:center;">💡 다른 레벨로 시작하고 싶으면 탭하세요</div>';
    const btnWrap=document.createElement('div');
    btnWrap.style.cssText='display:flex;gap:5px;flex-wrap:wrap;justify-content:center;';

    // 레벨 0 (문자 학습)
    const lv0btn=document.createElement('button');
    lv0btn.style.cssText='padding:5px 12px;border:2px solid #EDE9FE;background:white;color:var(--text);border-radius:20px;font-family:Nunito,sans-serif;font-size:11px;font-weight:800;cursor:pointer;';
    lv0btn.innerText='📝 문자 학습부터';
    lv0btn.onclick=()=>{appState.cardLevel=0;saveState();renderHome();};
    btnWrap.appendChild(lv0btn);

    for(let i=1;i<=6;i++){
      const lbtn=document.createElement('button');
      lbtn.style.cssText='padding:5px 12px;border:2px solid '+(i===safeLv?'var(--purple)':'#EDE9FE')+';background:'+(i===safeLv?'var(--purple)':'white')+';color:'+(i===safeLv?'white':'var(--text)')+';border-radius:20px;font-family:Nunito,sans-serif;font-size:11px;font-weight:800;cursor:pointer;';
      lbtn.innerText=LEVEL_NAMES[i];
      lbtn.onclick=()=>{appState.cardLevel=i;saveState();renderHome();};
      btnWrap.appendChild(lbtn);
    }
    altDiv.appendChild(btnWrap);
    resultDiv.appendChild(altDiv);
    wrap.appendChild(resultDiv);
  }

  renderQ();
}

function confirmLang(){
  const key = window._selLangKey ? window._selLangKey() : null;
  if(!key) return;
  // 레벨 테스트로 연결!
  appState.lang = key;
  saveState();
  startLevelTest(key);
}

function renderWords(){
  const wrap = document.getElementById('p-words');
  wrap.innerHTML = '';
  if(!appState.lang){ wrap.innerHTML='<div class="card" style="text-align:center;padding:2rem;">🌍 홈에서 언어를 먼저 선택해주세요!</div>'; return; }
  const cfg = LANG_CFG[appState.lang];
  const words = (WORD_DATA[appState.lang]||{})[appState.cardLevel]||WORD_DATA.eng[1];
  let idx = appState.wordIdx||0;
  let flipped = false;

  // 헤더
  const hdr = document.createElement('div');
  hdr.className = 'mission-header';
  hdr.innerHTML = `<div class="mission-icon" style="background:#FAF5FF;">📖</div><div><div class="mission-header-title">단어 카드</div><div class="mission-header-sub">${cfg.flag} ${cfg.name} · 레벨 ${appState.cardLevel}</div></div>`;
  wrap.appendChild(hdr);

  // 진행바
  const progRow = document.createElement('div');
  progRow.style.cssText = 'display:flex;align-items:center;gap:8px;margin-bottom:.7rem;';
  const pb = document.createElement('div'); pb.className='prog-bar';
  const pf = document.createElement('div'); pf.className='prog-fill prog-fill-purple'; pf.id='word-prog-fill';
  pb.appendChild(pf);
  const pt = document.createElement('div'); pt.id='word-prog-txt'; pt.style.cssText='font-size:11px;font-weight:800;color:var(--muted);white-space:nowrap;';
  progRow.appendChild(pb); progRow.appendChild(pt);
  wrap.appendChild(progRow);

  // 카드 영역
  const cardArea = document.createElement('div'); cardArea.id='word-card-area';
  wrap.appendChild(cardArea);

  // 수집함
  const collTitle = document.createElement('div');
  collTitle.style.cssText='display:flex;justify-content:space-between;align-items:center;margin:.7rem 0 5px;';
  collTitle.innerHTML='<div class="section-title">📦 수집함</div><div id="coll-count" style="font-size:11px;font-weight:800;color:var(--muted);">0개</div>';
  wrap.appendChild(collTitle);
  const collGrid = document.createElement('div');
  collGrid.id='word-coll-grid';
  collGrid.style.cssText='display:flex;flex-wrap:wrap;gap:5px;';
  wrap.appendChild(collGrid);

  function renderWordCard(){
    const w = words[idx];
    flipped=false;
    pf.style.width = ((idx+1)/words.length*100)+'%';
    pt.innerText = (idx+1)+'/'+words.length;

    cardArea.innerHTML=`
      <div class="card-scene" id="word-scene" onclick="wordFlip()">
        <div class="card-inner" id="word-inner">
          <div class="card-face card-front">
            <div class="card-word">${w.word}</div>
            <div class="card-phonetic">${w.phonetic}</div>
            <div style="font-size:10px;opacity:.6;margin-top:8px;">👆 탭해서 뒤집기</div>
          </div>
          <div class="card-face card-back" style="gap:6px;">
            <div style="font-size:26px;">${getWordEmoji(idx)}</div>
            <div style="font-size:11px;font-weight:700;color:var(--text);text-align:center;line-height:1.6;padding:0 .4rem;">${w.story}</div>
            <div style="background:#FAF5FF;color:var(--purple);font-weight:800;font-size:12px;padding:4px 12px;border-radius:20px;">${w.mean}</div>
          </div>
        </div>
      </div>
      <div class="judge-row">
        <button class="judge-btn btn-know" id="jb-know" onclick="wordJudge('know')" disabled><span>😎</span>알아요!</button>
        <button class="judge-btn btn-vague" id="jb-vague" onclick="wordJudge('vague')" disabled><span>🤔</span>애매해요</button>
        <button class="judge-btn btn-new2" id="jb-new2" onclick="wordJudge('new2')" disabled><span>😅</span>몰랐어요</button>
      </div>
    `;
    setTimeout(()=>wordSpeak(w.word), 300);
  }

  window.wordFlip = function(){
    const inner = document.getElementById('word-inner');
    flipped = !flipped;
    inner.classList.toggle('flipped', flipped);
    ['jb-know','jb-vague','jb-new2'].forEach(id=>{
      const el=document.getElementById(id); if(el) el.disabled=!flipped;
    });
    if(flipped) wordSpeak(words[idx].word);
  };

  window.wordJudge = function(type){
    const w=words[idx];
    if(!appState.wordCollection) appState.wordCollection={};
    appState.wordCollection[w.word]={mean:w.mean,type};
    saveState();
    updateCollGrid();
    idx++;
    if(idx>=words.length){
      appState.wordIdx=0;
      appState.todayDone.words=true;
      saveState();
      cardArea.innerHTML=`<div class="card" style="text-align:center;padding:1.5rem;animation:fadeIn .4s ease;">
        <div style="font-size:44px;">🎊</div>
        <div style="font-family:'Fredoka One',cursive;font-size:18px;color:var(--text);margin:4px 0;">단어 카드 완료!</div>
        <div style="font-size:12px;color:var(--muted);font-weight:700;margin-bottom:.8rem;">오늘의 단어를 모두 학습했어요 ✨</div>
        <button class="pill-btn pill-pink" onclick="goPage('p-order')">다음: 어순 트레이닝 →</button>
      </div>`;
    } else {
      appState.wordIdx=idx;
      saveState();
      renderWordCard();
    }
  };

  function updateCollGrid(){
    const cnt = Object.keys(appState.wordCollection||{}).length;
    const el=document.getElementById('coll-count'); if(el) el.innerText=cnt+'개';
    const grid=document.getElementById('word-coll-grid'); if(!grid) return;
    grid.innerHTML='';
    Object.entries(appState.wordCollection||{}).slice(-8).forEach(([word,d])=>{
      const chip=document.createElement('div');
      chip.style.cssText=`background:white;border:2px solid ${d.type==='know'?'#10B981':d.type==='vague'?'#F59E0B':'#EF4444'};border-radius:20px;padding:3px 9px;font-size:11px;font-weight:800;cursor:pointer;color:var(--text);`;
      chip.innerText=word;
      chip.onclick=()=>wordSpeak(word);
      grid.appendChild(chip);
    });
  }

  updateCollGrid();
  renderWordCard();
}

function wordSpeak(text){
  if(!window.speechSynthesis||!appState.lang) return;
  const lang = LANG_CFG[appState.lang].bcp;
  speakChar(text, lang);
}
function getWordEmoji(i){
  return ['✈️','🌸','☕','🍜','🎵','💜','🌟','🏖️','🎭','🌺'][i%10];
}

function renderOrder(){
  const wrap = document.getElementById('p-order');
  wrap.innerHTML='';
  if(!appState.lang){ wrap.innerHTML='<div class="card" style="text-align:center;padding:2rem;">🌍 홈에서 언어를 먼저 선택해주세요!</div>'; return; }
  const cfg=LANG_CFG[appState.lang];
  const data=ORDER_DATA[appState.lang]||ORDER_DATA.eng;

  const hdr=document.createElement('div'); hdr.className='mission-header';
  hdr.innerHTML=`<div class="mission-icon" style="background:#FFF5F9;">🔀</div><div><div class="mission-header-title">어순 트레이닝</div><div class="mission-header-sub">${cfg.flag} ${cfg.name} 어순 감각 키우기</div></div>`;
  wrap.appendChild(hdr);

  let qIdx=0;
  let score=0;
  let answered=false;
  let selected=[];

  // 진행바
  const progRow=document.createElement('div');
  progRow.style.cssText='display:flex;align-items:center;gap:8px;margin-bottom:.7rem;';
  const pb=document.createElement('div'); pb.className='prog-bar';
  const pf=document.createElement('div'); pf.className='prog-fill prog-fill-purple'; pf.id='order-prog-fill';
  pb.appendChild(pf);
  const pt=document.createElement('div'); pt.id='order-prog-txt'; pt.style.cssText='font-size:11px;font-weight:800;color:var(--muted);white-space:nowrap;';
  progRow.appendChild(pb); progRow.appendChild(pt);
  wrap.appendChild(progRow);

  const qArea=document.createElement('div'); qArea.id='order-q-area';
  wrap.appendChild(qArea);

  const COLORS=['#FF6B9D','#A855F7','#00D4AA','#FF8C69','#38BDF8','#FFD93D'];

  function renderQ(){
    const q=data[qIdx]; answered=false; selected=[];
    pf.style.width=((qIdx+1)/data.length*100)+'%';
    pt.innerText=(qIdx+1)+'/'+data.length;

    // 1단계: 어순 비교
    let compareHtml='<div class="sentence-compare"><div class="lang-label">🇰🇷 한국어</div><div class="sentence-blocks">';
    const krWords = q.kr.replace('。','').replace('.','').split(/\s+/);
    krWords.forEach(w=>{ compareHtml+=`<div class="sblock sblock-kr">${w}</div>`; });
    compareHtml+='</div><div class="arrow-row">↓</div>';
    compareHtml+=`<div class="lang-label">${cfg.flag} ${cfg.name} 어순</div><div class="sentence-blocks">`;
    q.blocks.forEach((b,i)=>{
      compareHtml+=`<div class="sblock sblock-${i}" style="background:${COLORS[i%COLORS.length]};">${b}<div style="font-size:9px;opacity:.8;">${q.reads[i]}</div></div>`;
    });
    compareHtml+=`</div><div style="font-size:11px;font-weight:700;color:var(--text);margin-top:7px;background:#FAF5FF;border-radius:8px;padding:6px 10px;">📌 ${q.explain}</div></div>`;

    // 2단계: 퀴즈
    // 블록 섞기
    const shuffled=[...q.blocks.keys()].sort(()=>Math.random()-.5);
    let choicesHtml='<div class="word-choices" id="order-choices">';
    shuffled.forEach(i=>{
      choicesHtml+=`<div class="word-choice" data-idx="${i}" onclick="orderPickWord(this)">${q.blocks[i]}</div>`;
    });
    choicesHtml+='</div>';

    qArea.innerHTML=`
      ${compareHtml}
      <div class="order-quiz">
        <div class="quiz-question">✏️ 이제 직접 배열해보세요!</div>
        <div class="quiz-kr">"${q.kr}"</div>
        <div style="font-size:10px;font-weight:800;color:var(--muted);margin-bottom:4px;">${cfg.flag} ${cfg.name} 어순으로 블록을 탭해서 배열하세요</div>
        <div class="answer-slots" id="order-slots"></div>
        ${choicesHtml}
        <div id="order-feedback"></div>
        <div style="display:flex;gap:7px;">
          <button onclick="orderReset()" style="padding:9px 14px;background:white;border:2px solid #EDE9FE;border-radius:12px;font-family:Nunito,sans-serif;font-size:12px;font-weight:800;cursor:pointer;color:var(--muted);">↺ 초기화</button>
          <button class="pill-btn pill-pink" id="order-check-btn" onclick="orderCheck()" style="flex:1;margin:0;padding:9px;">확인하기</button>
        </div>
        <div id="order-next-wrap" style="margin-top:8px;"></div>
      </div>
    `;
  }

  window.orderPickWord=function(el){
    if(answered) return;
    if(el.classList.contains('used')) return;
    el.classList.add('used');
    selected.push(parseInt(el.dataset.idx));
    const slots=document.getElementById('order-slots');
    const block=document.createElement('div');
    block.className='answer-slot';
    block.style.background=COLORS[parseInt(el.dataset.idx)%COLORS.length];
    block.innerText=el.innerText.split('\n')[0];
    block.dataset.idx=el.dataset.idx;
    block.onclick=function(){
      // 취소
      if(answered) return;
      selected=selected.filter(i=>i!==parseInt(this.dataset.idx));
      this.remove();
      document.querySelectorAll(`#order-choices .word-choice[data-idx="${this.dataset.idx}"]`).forEach(c=>c.classList.remove('used'));
    };
    slots.appendChild(block);
  };

  window.orderReset=function(){
    selected=[];
    document.getElementById('order-slots').innerHTML='';
    document.querySelectorAll('#order-choices .word-choice').forEach(c=>c.classList.remove('used'));
    document.getElementById('order-feedback').innerHTML='';
    document.getElementById('order-next-wrap').innerHTML='';
    answered=false;
  };

  window.orderCheck=function(){
    if(selected.length!==data[qIdx].blocks.length){
      document.getElementById('order-feedback').innerHTML='<div class="quiz-feedback wrong">블록을 모두 배열해주세요!</div>';
      return;
    }
    const q=data[qIdx];
    const correct=JSON.stringify(selected)===JSON.stringify(q.answer);
    if(correct) score++;
    answered=true;
    const fb=document.getElementById('order-feedback');
    if(correct){
      fb.innerHTML=`<div class="quiz-feedback correct">🎉 정답이에요! ${q.rule}</div>`;
    } else {
      const correctBlocks=q.answer.map(i=>`<span style="background:${COLORS[i%COLORS.length]};color:white;border-radius:6px;padding:2px 7px;font-size:12px;font-weight:800;">${q.blocks[i]}</span>`).join(' ');
      fb.innerHTML=`<div class="quiz-feedback wrong">💜 정답: ${correctBlocks}</div><div class="order-explain">📌 ${q.explain}<br><br>✅ 규칙: ${q.rule}</div>`;
    }
    const nextWrap=document.getElementById('order-next-wrap');
    if(qIdx<data.length-1){
      nextWrap.innerHTML=`<button class="pill-btn pill-mint" onclick="orderNext()" style="margin:0;">다음 문장 →</button>`;
    } else {
      appState.todayDone.order=true;
      saveState();
      nextWrap.innerHTML=`<div style="text-align:center;background:linear-gradient(135deg,#FAF5FF,#F0E8FF);border-radius:14px;padding:1rem;margin-top:5px;">
        <div style="font-size:32px;">🏆</div>
        <div style="font-family:'Fredoka One',cursive;font-size:16px;color:var(--purple);">어순 트레이닝 완료! ${score}/${data.length} 정답</div>
        <button class="pill-btn pill-coral" onclick="goPage('p-coach')" style="margin-top:.7rem;">다음: 작문 코치 →</button>
      </div>`;
    }
  };

  window.orderNext=function(){ qIdx++; renderQ(); };
  renderQ();
}

async function callGemini(prompt){
  const res=await fetch('/api/gemini',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt,maxTokens:1200,temperature:0.7})});
  if(!res.ok){const e=await res.json();throw new Error(e.error||'서버 오류');}
  const data=await res.json();
  return data.text||'';
}
function showLoading(id,txtId,msgs){
  document.getElementById(id).classList.remove('hidden');
  let i=0; document.getElementById(txtId).innerText=msgs[0];
  return setInterval(()=>{i=(i+1)%msgs.length;document.getElementById(txtId).innerText=msgs[i];},1100);
}
function hideLoading(id,timer){document.getElementById(id).classList.add('hidden');clearInterval(timer);}

// 구글 번역 TTS (태국어 등 브라우저 미지원 언어 처리)
const GTTS_LANGS = {'th-TH':'th','ja-JP':'ja','zh-CN':'zh-CN','es-ES':'es','it-IT':'it','en-US':'en'};

// ── TTS: 프록시(태국어) + Web Speech API(나머지) ──
let _ttsAudio = null;

function speakChar(text, lang){
  if(!text) return;
  if(lang === 'th-TH'){
    // 태국어: Vercel 프록시 → 구글 TTS
    speakViaTTS(text, 'th');
    return;
  }
  if(!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const run = ()=>{
    const voices = speechSynthesis.getVoices();
    const lc = lang.toLowerCase().split('-')[0];
    const voice = voices.find(v=>v.lang.toLowerCase()===lang.toLowerCase())
      || voices.find(v=>v.lang.toLowerCase().startsWith(lc));
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang;
    u.rate = 0.75;
    u.pitch = 1.0;
    if(voice) u.voice = voice;
    speechSynthesis.speak(u);
  };
  if(speechSynthesis.getVoices().length > 0) run();
  else { speechSynthesis.addEventListener('voiceschanged', run, {once:true}); setTimeout(run, 800); }
}

function speakViaTTS(text, langCode){
  // 이전 오디오 중지
  if(_ttsAudio){ _ttsAudio.pause(); _ttsAudio = null; }
  const url = '/api/tts?text=' + encodeURIComponent(text) + '&lang=' + langCode;
  const audio = new Audio(url);
  audio.volume = 1.0;
  audio.play().catch(e=>{
    console.warn('TTS 프록시 실패, Web Speech로 대체:', e);
    // 폴백: Web Speech API
    if(window.speechSynthesis){
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'th-TH'; u.rate = 0.7;
      speechSynthesis.speak(u);
    }
  });
  _ttsAudio = audio;
}

// 하위 호환
function speakGTTS(text, langCode){
  if(langCode === 'th') speakViaTTS(text, 'th');
  else speakChar(text, langCode === 'zh-CN' ? 'zh-CN' : langCode + '-' + langCode.toUpperCase());
}

  const br=document.createElement('div'); br.style.cssText='display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:.5rem;';
  const prevB=document.createElement('button'); prevB.style.cssText='padding:8px;background:white;border:2px solid #EDE9FE;border-radius:11px;font-family:Nunito,sans-serif;font-size:12px;font-weight:800;cursor:pointer;color:var(--muted);';
  prevB.innerText='← 이전';
  const nextB=document.createElement('button'); nextB.style.cssText='padding:8px;background:linear-gradient(135deg,var(--pink),var(--purple));border:none;border-radius:11px;font-family:Nunito,sans-serif;font-size:12px;font-weight:800;cursor:pointer;color:white;';
  br.appendChild(prevB); br.appendChild(nextB); sec.appendChild(br);

  // 전체 목록
  const listWrap=document.createElement('div'); listWrap.style.cssText='display:flex;flex-wrap:wrap;gap:4px;margin-top:.6rem;';
  items.forEach((item,i)=>{
    const chip=document.createElement('div');
    chip.style.cssText='background:white;border:2px solid #EDE9FE;border-radius:20px;padding:3px 9px;font-size:11px;font-weight:800;cursor:pointer;color:var(--text);';
    chip.innerText=item.word; chip.title=item.read;
    chip.onclick=()=>{ idx=i; render(); };
    listWrap.appendChild(chip);
  });
  sec.appendChild(listWrap);
  wrap.appendChild(sec);

  function render(){
    const item=items[idx]; let flipped=false;
    pf.style.width=((idx+1)/items.length*100)+'%';
    pt.innerText=(idx+1)+'/'+items.length;
    prevB.disabled=idx===0;
    nextB.innerText=idx===items.length-1?'처음부터 🔄':'다음 →';
    ca.innerHTML='';
    const card=document.createElement('div');
    card.style.cssText='background:linear-gradient(145deg,#7C3AED,#A855F7,#EC4899);border-radius:18px;padding:1rem;text-align:center;color:white;cursor:pointer;min-height:105px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;box-shadow:0 7px 20px rgba(168,85,247,.3);';
    card.innerHTML='<div style="font-size:28px;font-weight:800;letter-spacing:2px;">'+item.word+'</div><div style="font-size:11px;opacity:.7;">탭해서 발음 & 정답 확인 🔊</div>';
    card.onclick=function(){
      speakChar(item.speak||item.word, bcp);
      if(!flipped){
        flipped=true;
        card.style.background='white'; card.style.color='var(--text)'; card.style.border='2.5px solid #EDE9FE'; card.style.boxShadow='none';
        card.innerHTML='<div style="font-size:22px;font-weight:800;color:var(--purple);">'+item.word+'</div>'
          +'<div style="font-size:20px;font-weight:800;color:var(--pink);">'+item.read+'</div>'
          +'<div style="font-size:11px;font-weight:700;background:#FAF5FF;border-radius:8px;padding:4px 9px;color:var(--text);">📌 '+item.rule+'</div>'
          +(item.meaning?'<div style="font-size:11px;color:var(--muted);font-weight:700;">뜻: '+item.meaning+'</div>':'');
      } else {
        flipped=false;
        card.style.background='linear-gradient(145deg,#7C3AED,#A855F7,#EC4899)'; card.style.color='white'; card.style.border='none'; card.style.boxShadow='0 7px 20px rgba(168,85,247,.3)';
        card.innerHTML='<div style="font-size:28px;font-weight:800;letter-spacing:2px;">'+item.word+'</div><div style="font-size:11px;opacity:.7;">탭해서 발음 & 정답 확인 🔊</div>';
      }
    };
    ca.appendChild(card);
  }
  prevB.onclick=()=>{ if(idx>0){idx--;render();} };
  nextB.onclick=()=>{ idx=idx<items.length-1?idx+1:0; render(); };
  render();
}

//  전체 발음표 함수들 (성모×운모 조합표)
// ═══════════════════════════════════════════════════

// ── 공통: 스크롤 가능한 표 컨테이너 ──
function makeTableCard(title, subtitle){
  const wrap = document.createElement('div');
  wrap.style.cssText = 'margin-bottom:.7rem;';
  const hd = document.createElement('div');
  hd.className = 'card';
  hd.style.paddingBottom = '.4rem';
  hd.innerHTML = '<div style="font-size:12px;font-weight:800;color:var(--text);margin-bottom:2px;">'+title+'</div>'
    + '<div style="font-size:10px;color:var(--muted);font-weight:700;">'+subtitle+'</div>';
  const scroll = document.createElement('div');
  scroll.style.cssText = 'overflow-x:auto;-webkit-overflow-scrolling:touch;';
  hd.appendChild(scroll);
  wrap.appendChild(hd);
  return {wrap, scroll};
}

// ── 공통: 표 셀 생성 ──
function makeCell(text, type, onclick, title){
  const td = document.createElement('td');
  td.style.cssText = 'padding:4px 3px;text-align:center;border:1px solid #EDE9FE;white-space:nowrap;min-width:32px;';
  if(type==='header'){
    td.style.cssText = 'padding:4px 3px;text-align:center;border:1px solid #EDE9FE;background:#FAF5FF;font-size:10px;font-weight:800;color:var(--purple);white-space:nowrap;min-width:32px;position:sticky;';
  } else if(type==='rowheader'){
    td.style.cssText = 'padding:4px 5px;text-align:center;border:1px solid #EDE9FE;background:#FAF5FF;font-size:10px;font-weight:800;color:var(--purple);white-space:nowrap;position:sticky;left:0;z-index:1;';
  } else if(type==='cell' && onclick){
    td.style.cssText += 'cursor:pointer;font-size:11px;font-weight:700;color:var(--text);';
    td.addEventListener('click', onclick);
    td.addEventListener('click', ()=>{
      td.style.background='#EDE9FE';
      setTimeout(()=>td.style.background='',300);
    });
  } else if(type==='empty'){
    td.style.background = '#F9F9F9';
    td.style.color = '#CCC';
  }
  if(title) td.title = title;
  td.innerHTML = text || '';
  return td;
}

  const vowels=[
    {v:'า',label:'า\n(아장)',read:'아~',pos:'right'},

      '<div style="font-size:13px;color:var(--purple);font-weight:800;">'+v.v+'</div>'
      +'<div style="font-size:8px;color:var(--muted);">'+v.read+'</div>',
      'header'
    );
    th.style.minWidth='38px';
    hr.appendChild(th);
  });
  thead.appendChild(hr); table.appendChild(thead);

  // 데이터
  const tbody=document.createElement('tbody');
  consonants.forEach(cons=>{
    const tr=document.createElement('tr');
    const classColors={'중':'var(--purple)','고':'var(--pink)','저':'#10B981'};
    const th=makeCell(
      '<div style="font-size:16px;font-weight:800;color:'+classColors[cons.class]+';">'+cons.c+'</div>'
      +'<div style="font-size:9px;color:var(--muted);">'+cons.p+'</div>'
      +'<div style="font-size:8px;background:'+classColors[cons.class]+'22;color:'+classColors[cons.class]+';border-radius:3px;padding:0 3px;">'+cons.class+'자음</div>',
      'rowheader'
    );
    th.style.minWidth='50px';
    tr.appendChild(th);
    vowels.forEach(vow=>{
      const combo=combine(cons,vow);
      const td=makeCell(
        '<div style="font-size:16px;font-weight:800;color:var(--purple);">'+combo+'</div>'
        +'<div style="font-size:8px;color:var(--muted);">'+cons.p+vow.read+'</div>',
        'cell',()=>speakChar(combo,'th-TH'),
        combo+' : '+cons.p+'+'+vow.read
      );
      td.style.minWidth='38px';
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  scroll.appendChild(table);
  wrap.appendChild(w);
}

function simSelSit(el){document.querySelectorAll('.sit-card').forEach(c=>c.classList.remove('selected'));el.classList.add('selected');simSit=el.dataset.sit;}

function startSim(){
  simHistory=[]; simTurn=0; simCorrections=[];

  document.getElementById('sim-chat').classList.remove('hidden');

  document.getElementById('sim-npc-name').innerText=cfg.npcName;

function simAddBubble(who,name,text,kr){
  const area=document.getElementById('sim-chat-area');
  const typing=document.getElementById('sim-typing');
  const wrap=document.createElement('div'); wrap.className='bubble-wrap '+who;
  const nameEl=document.createElement('div'); nameEl.className='bubble-name'; nameEl.innerText=who==='npc'?name:'나';
  const bubble=document.createElement('div'); bubble.className='bubble '+who; bubble.innerText=text;
  if(who==='npc'){const spk=document.createElement('button');spk.style.cssText='background:none;border:none;font-size:11px;cursor:pointer;opacity:.6;';spk.innerText='🔊';spk.onclick=()=>simSpeak(text);bubble.appendChild(spk);}
  wrap.appendChild(nameEl); wrap.appendChild(bubble);
  if(kr){const krEl=document.createElement('div');krEl.className='bubble-kr';krEl.innerText=kr;wrap.appendChild(krEl);}
  area.insertBefore(wrap,typing); area.scrollTop=area.scrollHeight;
}

  simAddBubble('user','나',text,''); simHistory.push({role:'user',text}); simTurn++;
  simTyping(true);
  const hist=simHistory.slice(-6).map(h=>`${h.role==='model'?cfg.npcName:'학습자'}: ${h.text}`).join('\n');
  const langCode={영어:'English',일본어:'Japanese',중국어:'Chinese',스페인어:'Spanish',태국어:'Thai',이탈리아어:'Italian'}[simLang]||'English';
  const prompt=`당신은 ${langCode} 원어민 ${cfg.npcRole} "${cfg.npcName}"이에요. 상황: ${cfg.name}. 최근 대화:\n${hist}\n학습자 마지막 메시지: "${text}"\nJSON으로만: {"npc_reply":"원어민 답변(${langCode}, 2문장)","npc_reply_kr":"한국어 해석","grammar_feedback":"문법오류 있으면 설명 없으면 null","better_expression":"더 자연스러운 표현 없으면 null","is_end":${simTurn>=6}}`;
  try{
    const raw=await callGemini(prompt);
    const json=JSON.parse(raw.replace(/```json|```/g,'').trim());
    simTyping(false);
    simHistory.push({role:'model',text:json.npc_reply});
    simAddBubble('npc',cfg.npcName,json.npc_reply,json.npc_reply_kr);
    simSpeak(json.npc_reply);
    if(json.grammar_feedback){
      simCorrections.push({text,fb:json.grammar_feedback,better:json.better_expression});
      const fb=document.getElementById('sim-fb');
      fb.style.display='block'; fb.innerText='💜 '+json.grammar_feedback+(json.better_expression?' → '+json.better_expression:'');
    }
    simGenQR();
    if(json.is_end){
      appState.todayDone.sim=true; saveState();
      setTimeout(()=>{
        const area=document.getElementById('sim-chat-area');
        const end=document.createElement('div');
        end.style.cssText='background:linear-gradient(135deg,#FAF5FF,#F0E8FF);border-radius:14px;padding:1rem;text-align:center;margin-top:.5rem;';
        end.innerHTML=`<div style="font-size:36px;">🏆</div><div style="font-family:'Fredoka One',cursive;font-size:16px;color:var(--purple);">대화 완료!</div>${simCorrections.length?'<div style="font-size:12px;font-weight:700;color:var(--muted);margin-top:4px;">교정 포인트 '+simCorrections.length+'개</div>':''}<button class="pill-btn pill-pink" onclick="simReset()" style="margin-top:.7rem;">🔄 다시 도전</button>`;
        area.appendChild(end); area.scrollTop=area.scrollHeight;
      },800);
    } else { document.getElementById('sim-send-btn').disabled=false; }
  }catch(e){simTyping(false);simAddBubble('npc',cfg.npcName,'(오류가 났어요 😢)','');document.getElementById('sim-send-btn').disabled=false;}
}

function simReset(){
  simHistory=[]; simTurn=0; simCorrections=[];
  document.getElementById('sim-chat').classList.add('hidden');
  document.getElementById('sim-setup').classList.remove('hidden');
  document.getElementById('sim-qr-row').innerHTML='';
  const fb=document.getElementById('sim-fb'); if(fb) fb.style.display='none';
}
function simHint(){
  const hint=document.getElementById('sim-hint-box');
  hint.classList.toggle('show');
  if(hint.classList.contains('show')) hint.innerText='💡 말하기 어려우면 아래 버튼을 탭해보세요!';
}
function simKeyDown(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();simSend();}}
function simSpeak(text){ speakChar(text, simBcp); }

// ════════════════════════════════════════════
//  초기화
// ════════════════════════════════════════════
loadState();
renderHome();
</script>
